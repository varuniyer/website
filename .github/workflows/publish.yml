name: publish

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths-ignore: [README.md, AGENTS.md]

concurrency:
  group: publish
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v7

      - name: Build
        run: podman build --layers=false -o built .

      - name: Push the `site` branch
        run: |
          git --work-tree=built checkout --orphan site
          git --work-tree=built add -A
          git -c user.name='github-actions[bot]' -c user.email='41898728+github-actions[bot]@users.noreply.github.com' commit -qm "Build $GITHUB_SHA"
          git push --force origin site

      - name: Dispatch the bootc-setup build
        run: gh workflow run build-and-publish.yml --repo varuniyer/bootc-setup
        env:
          GH_TOKEN: ${{ secrets.GH_WORKFLOW_TOKEN }}
