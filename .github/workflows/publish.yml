name: publish

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths-ignore: [README.md, AGENTS.md, LICENSE]

concurrency:
  group: publish
  cancel-in-progress: true

permissions:
  contents: write
  id-token: write
  attestations: write

jobs:
  publish:
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7

      - name: Build
        run: podman build --layers=false -o built .

      # bootc-gce-server's build accepts the site only when this workflow's attestation verifies.
      - name: Pack the site
        run: tar -czf site.tar.gz -C built .

      - uses: actions/attest-build-provenance@v3
        with:
          subject-path: site.tar.gz

      - name: Publish the tarball on the `site-tarball` release
        run: |
          gh release view site-tarball >/dev/null 2>&1 || gh release create site-tarball --title site-tarball --notes 'The built site and CV, attested by the publish workflow.'
          gh release upload site-tarball site.tar.gz --clobber
        env:
          GH_TOKEN: ${{ github.token }}

      - name: Dispatch the bootc-gce-server build
        run: gh workflow run build-and-publish.yml --repo varuniyer/bootc-gce-server
        env:
          GH_TOKEN: ${{ secrets.GH_WORKFLOW_TOKEN }}
